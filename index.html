<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcane Lexicon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game-canvas" aria-label="Arcane Lexicon — a 3D typing spell game"></canvas>

    <!-- Enemy word billboard container — positioned absolutely over canvas -->
    <div id="enemy-labels"></div>

    <!-- HUD overlays on top of canvas -->
    <div id="hud-health">
      <div class="health-label">HP</div>
      <div class="health-bar-bg">
        <div class="health-bar-fill"></div>
      </div>
    </div>

    <div id="hud-wave">WAVE 1</div>

    <div id="hud-word"></div>

    <div id="hud-spellbook">
      <div class="spell-slot locked">····</div>
      <div class="spell-slot locked">····</div>
      <div class="spell-slot locked">····</div>
      <div class="spell-slot locked">····</div>
    </div>

    <!-- Title screen overlay -->
    <div id="screen-title" class="screen-overlay">
      <div class="title-text">A R C A N E &nbsp; L E X I C O N</div>
      <div class="title-cta">press enter to begin</div>
      <div class="title-hint">type enemy words to kill &nbsp;·&nbsp; latin spells bend the rules</div>
    </div>

    <!-- Wave clear overlay -->
    <div id="screen-wave" class="screen-overlay hidden"></div>

    <!-- Death screen overlay -->
    <div id="screen-dead" class="screen-overlay hidden">
      <div class="dead-stats"></div>
      <div class="dead-cta">press enter to restart</div>
    </div>

    <!-- Pause menu overlay -->
    <div id="screen-pause" class="screen-overlay hidden">
      <div class="pause-title">P A U S E D</div>
      <div class="pause-options">
        <div class="pause-option" id="pause-opt-resume">RESUME</div>
        <div class="pause-option" id="pause-opt-restart">RESTART</div>
        <div class="pause-option" id="pause-opt-exit">EXIT</div>
      </div>
      <div class="pause-hint">type to choose</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
